name: Petri Panic gameplay smoke tests
on:
  push:
    branches: [main, 'feat/**', 'art/**']
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source, roster and art contracts
        run: node tests/source-smoke.cjs
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser interaction and viewport smoke tests
        run: node tests/browser-smoke.cjs
      - name: Creature art review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creature-art-phone-desktop
          path: art-test-shots/*.png
          if-no-files-found: ignore
