<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" aria-label="Illustrated pastel Pink Laboratories research room, with windows, equipment, shelves, and a glass workbench">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2=".45" y2="1"><stop stop-color="#a99bc7"/><stop offset=".47" stop-color="#dfb9dd"/><stop offset="1" stop-color="#d795bd"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#bfeafa"/><stop offset=".55" stop-color="#fee5eb"/><stop offset="1" stop-color="#f9b5d4"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe6cb"/><stop offset=".23" stop-color="#d9aac4"/><stop offset=".62" stop-color="#ba83ab"/><stop offset="1" stop-color="#71577f"/></linearGradient>
 <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe5ed"/><stop offset=".33" stop-color="#c88bb7"/><stop offset="1" stop-color="#795a91"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcffff" stop-opacity=".9"/><stop offset=".35" stop-color="#add9f6" stop-opacity=".55"/><stop offset="1" stop-color="#f5b9db" stop-opacity=".82"/></linearGradient>
 <linearGradient id="flask" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffd8e7"/><stop offset="1" stop-color="#e34d9d"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#fff9ff" stop-opacity=".87"/><stop offset="1" stop-color="#fff3fb" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="drop" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="5"/></filter>
